plugins { id 'com.android.library' }

def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def repo = projectDir.parentFile.parentFile
def embedModel = providers.gradleProperty('nfiq2.embedModel')
    .map { it.toBoolean() }.getOrElse(false)
def modelMode = embedModel ? 'embedded' : 'external'
def nativeBuild = new File(repo, "build-android-example/arm64-v8a-${modelMode}")
def nativePrefix = new File(nativeBuild, 'install_staging/nfiq2')

android {
    namespace = 'gov.nist.nfiq2'
    compileSdk = 36
    ndkVersion = '29.0.14206865'
    if (local.getProperty('nfiq2.ndkPath')) {
        ndkPath = local.getProperty('nfiq2.ndkPath')
    }
    defaultConfig {
        minSdk = 21
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DNFIQ2_INSTALL_DIR=${nativePrefix.absolutePath.replace('\\', '/')}",
                    "-DNFIQ2_EMBED_MODEL=${embedModel ? 'ON' : 'OFF'}",
                    '-DANDROID_STL=c++_static'
                cppFlags '-std=c++11'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.31.6'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        warningsAsErrors = true
        disable += 'ChromeOsAbiSupport'
    }
}

def cmakeExe = new File(android.sdkDirectory, 'cmake/3.31.6/bin/cmake' +
    (System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''))
def ndkDir = local.getProperty('nfiq2.ndkPath') ? file(local.getProperty('nfiq2.ndkPath')) :
    new File(android.sdkDirectory, 'ndk/29.0.14206865')
def configureNative = tasks.register('configureNfiq2', Exec) {
    environment 'PATH', cmakeExe.parent + File.pathSeparator + System.getenv('PATH')
    commandLine cmakeExe, '-S', repo, '-B', nativeBuild, '-G', 'Ninja',
        "-DCMAKE_TOOLCHAIN_FILE=${new File(ndkDir, 'build/cmake/android.toolchain.cmake')}",
        '-DANDROID_ABI=arm64-v8a', '-DANDROID_PLATFORM=android-21',
        '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_NFIQ2_CLI=OFF',
        "-DEMBED_RANDOM_FOREST_PARAMETERS=${embedModel ? 'ON' : 'OFF'}"
}
def buildNative = tasks.register('buildNfiq2', Exec) {
    dependsOn configureNative
    environment 'PATH', cmakeExe.parent + File.pathSeparator + System.getenv('PATH')
    environment 'CMAKE_BUILD_PARALLEL_LEVEL', '4'
    commandLine cmakeExe, '--build', nativeBuild, '--parallel', '4'
}
tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('configureCMake') ||
        name.startsWith('buildCMake')) dependsOn buildNative
}
